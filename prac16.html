<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 物件屬性操作</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-left: 5px solid #007bff;
            font-family: "Courier New", Courier, monospace;
            border-radius: 4px;
        }
        ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>1. 原始物件的所有屬性 (Properties)</h2>
    <ul id="properties-list"></ul>

    <h2>2. 刪除 'age' 屬性後的物件內容</h2>
    <pre id="object-result"></pre>
</div>

<script>
    // 題目提供的 Sample object
    var Person = {
        firstName : "Tony",
        lastName : "Lee",
        age : 50,
        eyeColor : "Blue"
    };

    // 1. 列出所有屬性 (List all properties)
    var properties = Object.keys(Person);
    var listElement = document.getElementById("properties-list");
    
    properties.forEach(function(prop) {
        var li = document.createElement("li");
        li.textContent = prop;
        listElement.appendChild(li);
    });

    // 2. 刪除 age 屬性 (Delete the age property)
    delete Person.age;

    // 3. 印出刪除後的物件 (Print the object after deleting)
    // 使用 JSON.stringify(obj, null, 2) 來排版印出 JSON 字串
    document.getElementById("object-result").textContent = JSON.stringify(Person, null, 2);
    
    // 同時在瀏覽器 Console 中印出結果方便檢查
    console.log("刪除後的物件：", Person);
</script>

</body>
</html>
