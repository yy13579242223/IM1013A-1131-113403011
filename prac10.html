<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Spec Implementation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        .widget-container {
            width: 496px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            overflow: hidden;
        }

        .header {
            height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #eaeaea;
        }

        .header-title { font-size: 13px; color: #707070; }

        .spec-button {
            height: 22px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #2f2f2f;
            color: #2f2f2f;
            font-size: 13px;
            padding: 0 18px;
            cursor: pointer;
            outline: none;
        }

        /* 調整 scroll-area 為彈性佈局 */
        .scroll-area {
            display: flex; /* 讓內容與右側滑桿並排 */
            padding: 20px 0 20px 20px; /* 右側 padding 留給滑桿區 */
            max-height: 400px;
            overflow-y: auto;
        }

        /* 內容區 */
        .content-main { flex: 1; }

        /* 右側 26px 的滑桿區 */
        .scrollbar-track {
            width: 26px;
            background-color: #f9f9f9;
            border-left: 1px solid #eaeaea;
            display: none; /* 預設隱藏，展開資訊時顯示 */
        }
        .scrollbar-track.active { display: block; }

        .image-wrapper {
            width: 450px;
            height: 240px;
            background-color: #ffdeb3; 
            display: flex;
            justify-content: center;   
            align-items: flex-start;   
            overflow: hidden;
            margin-bottom: 10px;
        }
        .image-wrapper img { height: 100%; width: auto; display: block; }

        .info-section { display: none; }
        .info-section.active { display: block; }

        .info-row {
            background-color: #b5ffb5; 
            color: #2f2f2f;
            font-size: 13px;
            padding: 2px 8px;          
            margin-bottom: 6px;       
            word-break: break-all;
            width: 434px; /* 扣除 padding 確保對齊 */
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="header">
            <span class="header-title">預覽</span>
            <button id="infoToggleBtn" class="spec-button">查看資訊</button>
        </div>

        <div class="scroll-area">
            <div class="content-main">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1494548162494-384bba4ab999?fit=crop&w=400&h=240&q=80" alt="Preview">
                </div>

                <div id="fileInfoDetails" class="info-section">
                    <div class="info-row">修改日期：2017/10/12</div>
                    <div class="info-row">類別：JPG</div>
                    <div class="info-row">大小：466.97KB</div>
                    <div class="info-row">路徑：\\designcenter.qnap.com.tw\DesignCenter\PM、RD 請進入\WEB\Stations\A_Image2PDF\v2\sample</div>
                </div>
            </div>
            
            <div id="scrollbarTrack" class="scrollbar-track"></div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('infoToggleBtn');
        const infoDetails = document.getElementById('fileInfoDetails');
        const scrollbarTrack = document.getElementById('scrollbarTrack');

        toggleBtn.addEventListener('click', function() {
            const isActive = infoDetails.classList.toggle('active');
            scrollbarTrack.classList.toggle('active');
            toggleBtn.textContent = isActive ? '收起資訊' : '查看資訊';
        });
    </script>

</body>
</html>
