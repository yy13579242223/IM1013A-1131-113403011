<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Roboto', sans-serif; color: #2f2f2f; margin: 0; padding: 20px; }

        .list-container {
            display: flex;
            align-items: center;
            border: 1px solid #eaeaea;
            background-color: #f6f6f6;
            padding: 10px 0;
            width: fit-content;
        }

        /* 左側空間 20px */
        .left-space { width: 20px; }

        /* 預覽區域總寬度 496px */
        .preview-wrapper {
            width: 496px;
            height: 260px;
            background-color: #fff8e1;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 預覽內框 450x240 */
        .preview-content {
            width: 450px;
            height: 240px;
            background-color: #eee;
            overflow: hidden;
        }

        .preview-content img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 確保圖片填滿區域 */
        }

        /* 按鈕 h22 / R8 */
        .action-btn {
            position: absolute;
            top: 15px;
            right: 18px;
            height: 22px;
            border-radius: 8px;
            border: 1px solid #2f2f2f;
            background-color: #ffffff;
            font-size: 13px;
            padding: 0 15px;
            cursor: pointer;
        }

        /* 右側空間 26px */
        .right-space { width: 26px; }

        /* 詳細資訊展開區 */
        #moreInfo {
            display: none;
            width: 770px;
            border: 1px solid #ccc;
            margin-top: 5px;
            padding: 10px;
        }

        .scroll-area {
            height: 200px;
            overflow-y: auto;
            background-color: white;
            padding: 10px;
        }

        .info-bar {
            background-color: #66ff66;
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="list-container">
        <div class="left-space"></div>

        <div class="preview-wrapper">
            <div class="preview-content">
                <img src="http://googleusercontent.com/image_collection/image_retrieval/11708313373894269334_0" alt="夕陽河邊風景">
            </div>
            <button class="action-btn" onclick="toggleDetails()">查看資訊</button>
        </div>

        <div class="right-space"></div>
    </div>

    <div id="moreInfo">
        <div style="text-align: right; margin-bottom: 5px;">
            <button onclick="toggleDetails()">收起資訊</button>
        </div>
        <div class="scroll-area">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/11708313373894269334_0" width="200" alt="詳細圖">
            <div class="info-bar">修改日期 : 2017/10/12</div>
            <div class="info-bar">類型 : JPG</div>
            <div class="info-bar">大小 : 466.97KB</div>
            <div class="info-bar">路徑 : \\designcenter\web\sample</div>
        </div>
    </div>

    <script>
        function toggleDetails() {
            var x = document.getElementById("moreInfo");
            x.style.display = (x.style.display === "block") ? "none" : "block";
        }
    </script>
</body>
</html>
