<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; color: #2f2f2f; }

        .list-row {
            display: flex;
            align-items: center;
            border: 1px solid #eaeaea;
            padding: 10px;
            background-color: #f6f6f6;
            width: 496px;
        }
        /* 預覽圖片區塊 */
        .preview-area {
            width: 450px;
            height: 240px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ccc;
            margin: 0 20px;
            position: relative;
            overflow: hidden; /* 確保圖片不超出區域 */
        }

        .preview-area img { width: 100%; height: 100%; object-fit: cover; }

        /* 右上角「查看資訊」按鈕 */
        .action-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            height: 22px;
            border-radius: 8px; /* R8 */
            border: 1px solid #2f2f2f;
            background: #ffffff;
            cursor: pointer;
            padding: 0 10px;
            font-size: 13px;
        }

        /* 展開後的詳細內容區塊 */
        #moreInfo {
            display: none; /* 預設隱藏 */
            width: 770px;
            border: 1px solid #ccc;
            margin-top: 5px;
            padding: 10px;
        }

        /* 滾動區域設定 */
        .scroll-area {
            height: 200px;
            overflow-y: auto; /* 自動顯示滾動條 */
            background-color: white;
            padding: 10px;
        }

        /* 綠色資訊條樣式 */
        .info-bar {
            background-color: #66ff66; /* 綠色背景 */
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="list-row">
        <span>20171012_1.jpg</span>
        
        <div class="preview-area">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/6018547290937680982_0" alt="河邊風景">
            <button class="action-btn" onclick="toggleDetails()">查看資訊</button>
        </div>
    </div>

    <div id="moreInfo">
        <div style="text-align: right; margin-bottom: 5px;">
            <button onclick="toggleDetails()">收起資訊</button>
        </div>
        
        <div class="scroll-area">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/6018547290937680982_0" width="200" alt="詳細圖">
            <div class="info-bar">修改日期 : 2017/10/12</div>
            <div class="info-bar">類型 : JPG</div>
            <div class="info-bar">大小 : 466.97KB</div>
            <div class="info-bar">路徑 : \\designcenter\web\sample</div>
        </div>
    </div>

    <script>
        function toggleDetails() {
            var x = document.getElementById("moreInfo");
            x.style.display = (x.style.display === "block") ? "none" : "block";
        }
    </script>
</body>
</html>
