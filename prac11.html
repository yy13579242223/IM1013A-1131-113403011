<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        .container {
            display: flex;
            align-items: flex-start; /* 讓圖片向上對齊 */
            justify-content: space-between; /* 讓內容左右分散貼齊 */
            padding: 20px;
            gap: 0px; /* 控制圖片間的基礎間距 */
        }

        /* 左圖：圓角，無變形 */
        .img-left {
            width: 33%;
            height: 300px;
            border-radius: 18px;
            object-fit: cover; 
        }

        /* 中間圖：圓形，直徑 150px */
        .img-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid #000;
            object-fit: cover;
            /* 負 margin 可讓圓形往左右兩側的圖片靠得更近 */
            margin-left: -50px;
            margin-right: -50px;
        }

        /* 右圖：寬 33%，高 300px，有變形 */
        .img-right {
            width: 33%;
            height: 300px;
            /* 不加 object-fit 會自動拉伸產生 distortion */
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="img-left" src="https://picsum.photos/seed/eiffel1/500/400" alt="Eiffel Tower">
        <img class="img-circle" src="https://picsum.photos/seed/fjord/300/300" alt="Landscape">
        <img class="img-right" src="https://picsum.photos/seed/eiffel1/500/400" alt="Eiffel Tower distorted">
    </div>

</body>
</html>
