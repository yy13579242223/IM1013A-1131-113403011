<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        .container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* 左圖：圓角，無變形 */
        .img-left {
            width: 33%;
            height: 300px;
            border-radius: 18px;
            object-fit: cover; /* 確保無變形 */
        }

        /* 中間圖：圓形，直徑 150px */
        .img-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid #000;
            object-fit: cover;
        }

        /* 右圖：寬 33%，高 300px，有變形 */
        .img-right {
            width: 33%;
            height: 300px;
            /* 移除 object-fit: cover 會導致圖片強制縮放而產生 distortion */
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="img-left" src="https://picsum.photos/seed/eiffel1/500/400" alt="Eiffel Tower">
        <img class="img-circle" src="https://picsum.photos/seed/fjord/300/300" alt="Landscape">
        <img class="img-right" src="https://picsum.photos/seed/eiffel1/500/400" alt="Eiffel Tower distorted">
    </div>

</body>
</html>
