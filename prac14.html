<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        #text-display {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="text-display">Hello</div>
    <button id="action-btn">Button</button>

    <script>
        const textElement = document.getElementById('text-display');
        const button = document.getElementById('action-btn');

        button.addEventListener('mouseover', function() {
            textElement.style.color = 'magenta';
        });

        button.addEventListener('mouseout', function() {
            if (textElement.innerText === "Hello") {
                textElement.style.color = 'black';
            }
        });

        button.addEventListener('click', function() {
            textElement.innerText = "Mouse Click";
            textElement.style.color = 'magenta';
        });
    </script>

</body>
</html>
