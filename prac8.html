<!DOCTYPE html>
<html lang=>
<head>
    <style>
        body {
            font-family: serif;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #808080;
            color: white;
        }

        tr:nth-child(2), tr:nth-child(4) {
            background-color: yellow;
        }

        .fixed-box {
            position: fixed;   
            top: 20px;         
            right: 20px;       
            
            width: 150px;
            height: 120px;
            border: 3px solid #7cb342; 
            padding: 10px;
            background-color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
        </tr>
        <tr>
            <td>1</td>
            <td>1</td>
        </tr>
        <tr>
            <td>2</td>
            <td>2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>3</td>
        </tr>
    </table>

    <div class="fixed-box">
        This div element has position: fixed;
    </div>

</body>
</html>
