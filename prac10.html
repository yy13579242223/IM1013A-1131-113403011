<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Spec Implementation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-color: #f0f0f0; margin: 0; font-family: 'Roboto', sans-serif;
        }

        .widget-container {
            width: 496px; background-color: #ffffff; border: 1px solid #dcdcdc; overflow: hidden;
        }

        .header {
            height: 35px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; border-bottom: 1px solid #eaeaea;
        }

        .header-title { font-size: 13px; color: #707070; }

        .spec-button {
            height: 22px; border-radius: 8px; border: 1px solid #2f2f2f;
            background-color: #ffffff; font-size: 13px; padding: 0 18px; cursor: pointer;
        }

        /* 滾動區域設定 */
        .scroll-area {
            max-height: 400px;
            overflow-y: auto; /* 啟用原生可操作滑桿 */
            padding: 20px 0 20px 20px; /* 左邊留白 20px */
            /* 讓滑桿顯眼的關鍵設定 */
            scrollbar-width: thin; 
        }

        /* 強制設定瀏覽器滑桿樣式，寬度為 26px */
        .scroll-area::-webkit-scrollbar {
            width: 26px; /* 滑桿區塊總寬 */
            background-color: #f9f9f9; /* 軌道顏色 */
            border-left: 1px solid #eaeaea;
        }
        .scroll-area::-webkit-scrollbar-thumb {
            background-color: #c0c0c0; /* 滑塊顏色 */
            border: 6px solid #f9f9f9; /* 讓滑塊看起來像懸浮在軌道中 */
            border-radius: 20px;
        }

        .content-main { width: 450px; }

        .image-wrapper {
            width: 450px; height: 240px; background-color: #ffdeb3;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; margin-bottom: 10px;
            padding: 0 20px; /* 圖片左右留出橘色空間 */
            box-sizing: border-box;
        }

        .image-wrapper img { max-width: 100%; height: auto; }

        .info-section { display: none; }
        .info-section.active { display: block; }

        .info-row {
            background-color: #b5ffb5; color: #2f2f2f; font-size: 13px;
            padding: 2px 8px; margin-bottom: 6px; word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="header">
            <span class="header-title">預覽</span>
            <button id="infoToggleBtn" class="spec-button">查看資訊</button>
        </div>

        <div class="scroll-area">
            <div class="content-main">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1494548162494-384bba4ab999?fit=crop&w=400&h=240&q=80" alt="Preview">
                </div>

                <div id="fileInfoDetails" class="info-section">
                    <div class="info-row">修改日期：2017/10/12</div>
                    <div class="info-row">類別：JPG</div>
                    <div class="info-row">大小：466.97KB</div>
                    <div class="info-row">路徑：\\designcenter.qnap.com.tw\DesignCenter\PM\WEB\sample</div>
                   
                </div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('infoToggleBtn');
        const infoDetails = document.getElementById('fileInfoDetails');

        toggleBtn.addEventListener('click', function() {
            const isActive = infoDetails.classList.toggle('active');
            toggleBtn.textContent = isActive ? '收起資訊' : '查看資訊';
        });
    </script>
</body>
</html>
