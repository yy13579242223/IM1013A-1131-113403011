<!DOCTYPE html>
<html>
    <style>
        .box {
            font-family: serif;
            font-weight: bold;
            font-size: 24px;
            padding: 10px;
            margin-bottom: 20px;
            width: 400px;
        }
      
        .box1 {
            background-color: lightblue;
            border: 5px double tomato;
            color: black;
        }

        .box2 {
            background-color: yellow;
            border: 3px solid cornflowerblue;
            border-radius: 15px; 
            color: black;
        }

        .box3 {
            background-color: mediumseagreen;
            border: 8px dotted gray; 
            color: black;
        }
    </style>
</head>
<body>

    <div class="box box1">Hello World</div>

    <div class="box box2">Hello World</div>

    <div class="box box3">Hello World</div>

</body>
</html>
