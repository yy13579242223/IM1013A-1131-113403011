<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #4da3d9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: #eee;
        padding: 15px;
        border-radius: 15px;
        width: 90%;
        max-width: 500px;
    }

    .box {
        margin: 8px 0;
        border-radius: 5px;
    }

    .header {
        background: #a8cf45;
        height: 100px;
    }

    .content {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .content div {
        background: #17aeb7;
        height: 80px;
    }

    .footer {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .footer div {
        background: #cfd4d7;
        height: 60px;
    }

    /* 🔥 RWD：螢幕 >= 480px */
    @media (min-width: 480px) {

        .card {
            max-width: 700px;
        }

        .content {
            flex-direction: row;
        }

        .content div {
            flex: 1;
            height: 120px;
        }

        .footer {
            grid-template-columns: repeat(4, 1fr);
        }

        .footer div {
            height: 80px;
        }
    }

</style>
</head>

<body>

<div class="card">

    <div class="box header"></div>

    <div class="content">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div class="footer">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

</div>

</body>
</html>
