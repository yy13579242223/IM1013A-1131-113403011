<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>UI Spec Implementation</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
    margin: 0;
}

/* 外框 */
.widget-container {
    width: 496px;
    background: #fff;
    border: 1px solid #ccc;
}

/* header */
.header {
    height: 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
    border-bottom: 1px solid #ddd;
}

/* 按鈕 */
.spec-button {
    height: 22px;
    padding: 0 15px;
    border-radius: 8px;
    border: 1px solid #000;
    background: #fff;
    cursor: pointer;
}

/* 🔥 滾動區（重點） */
.scroll-area {
    display: flex;
    padding-left: 20px; /* ← 圖中標示 */
    max-height: 300px; /* 強制出現滾動 */
    overflow-y: auto;
}

/* 內容 */
.content-main {
    width: calc(100% - 26px); /* 預留 scrollbar 空間 */
}

/* 圖片 */
.image-wrapper {
    width: 450px;
    height: 240px;
    background: #ffdeb3;
    margin-bottom: 10px;
}

.image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 資訊區 */
.info-section {
    display: none;
}

.info-section.active {
    display: block;
}

/* 每一列（符合圖中高度） */
.info-row {
    background: #66ff66;
    margin-bottom: 6px;
    padding: 6px 8px;
    font-size: 13px;
    line-height: 20px; /* 保證高度 */
    min-height: 10px; /* 圖中要求 */
    width: 434px;
}

/* scrollbar（使用瀏覽器原生但美化） */
.scroll-area::-webkit-scrollbar {
    width: 26px; /* ← 圖中要求 */
}

.scroll-area::-webkit-scrollbar-track {
    background: #f9f9f9;
}

.scroll-area::-webkit-scrollbar-thumb {
    background: #c0c0c0;
    border-radius: 10px;
    border: 6px solid #f9f9f9; /* 做出中間細條效果 */
}

</style>
</head>

<body>

<div class="widget-container">

    <div class="header">
        <span>預覽</span>
        <button id="btn" class="spec-button">查看資訊</button>
    </div>

    <div class="scroll-area">
        <div class="content-main">

            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1494548162494-384bba4ab999?fit=crop&w=400&h=240&q=80">
            </div>

            <div id="info" class="info-section">
                <div class="info-row">修改日期：2017/10/12</div>
                <div class="info-row">類別：JPG</div>
                <div class="info-row">大小：466.97KB</div>
                <div class="info-row">路徑：\\designcenter.qnap.com.tw\DesignCenter\PM\RD\WEB\solutions\A_Image2PD\v2sample</div>

                
            </div>

        </div>
    </div>

</div>

<script>
const btn = document.getElementById('btn');
const info = document.getElementById('info');

btn.onclick = () => {
    const active = info.classList.toggle('active');
    btn.textContent = active ? '收起資訊' : '查看資訊';
};
</script>

</body>
</html>
