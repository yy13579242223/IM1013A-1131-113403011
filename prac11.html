<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        .container {
            display: flex;
            align-items: flex-start;
            padding: 20px;
        }

        /* 左右圖片：平均分掉剩餘空間 */
        .img-left,
        .img-right {
            width: calc((100% - 150px) / 2);
            height: 300px;
        }

        /* 左圖：圓角、不變形 */
        .img-left {
            border-radius: 18px;
            object-fit: cover;
        }

        /* 中間圓形 */
        .img-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid #000;
            object-fit: cover;
        }

        /* 右圖：保留拉伸效果（示範用） */
        .img-right {
            height: 300px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="img-left" src="https://picsum.photos/seed/eiffel1/500/400" alt="Eiffel Tower">
        <img class="img-circle" src="https://picsum.photos/seed/fjord/300/300" alt="Landscape">
        <img class="img-right" src="https://picsum.photos/seed/eiffel1/500/400" alt="Eiffel Tower distorted">
    </div>

</body>
</html>
