<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>UI Spec Implementation</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f0f0; margin: 0; font-family: 'Roboto', sans-serif; }
        
        .widget-container { width: 496px; background-color: #ffffff; border: 1px solid #dcdcdc; }

        .header { height: 35px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid #eaeaea; }
        .spec-button { height: 22px; border-radius: 8px; border: 1px solid #2f2f2f; background-color: #ffffff; cursor: pointer; padding: 0 18px; }

        /* 滑動區域：高度涵蓋圖片與資訊欄 */
        .scrollable-area {
            height: 400px; /* 這裡調整您需要的高度 */
            overflow-y: auto;
            padding: 15px 0 15px 20px;
        }

        /* 這裡定義 26px 的滑桿，從圖片頂端開始 */
        .scrollable-area::-webkit-scrollbar { width: 26px; background-color: #f9f9f9; border-left: 1px solid #eaeaea; }
        .scrollable-area::-webkit-scrollbar-thumb { background: #c0c0c0; border: 8px solid #f9f9f9; border-radius: 20px; }

        /* 圖片區 */
        .image-wrapper { width: 450px; height: 240px; background-color: #ffdeb3; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 0 20px; box-sizing: border-box; }
        .image-wrapper img { width: 100%; height: auto; }

        /* 資訊欄區 */
        .info-section { display: none; padding-top: 10px; }
        .info-section.active { display: block; }
        .info-row { background-color: #b5ffb5; color: #2f2f2f; font-size: 13px; padding: 2px 8px; margin-bottom: 6px; width: 420px; }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="header">
            <span>預覽</span>
            <button id="infoToggleBtn" class="spec-button">查看資訊</button>
        </div>

        <div class="scrollable-area">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1494548162494-384bba4ab999?fit=crop&w=400&h=240&q=80" alt="Preview">
            </div>

            <div id="fileInfoDetails" class="info-section">
                <div class="info-row">修改日期：2017/10/12</div>
                <div class="info-row">類別：JPG</div>
                <div class="info-row">大小：466.97KB</div>
                <div class="info-row">路徑：\\designcenter.qnap.com.tw\DesignCenter\PM\WEB\sample</div>
                <div class="info-row">測試滑桿：這部分的內容會觸發滑桿。</div>
                <div class="info-row">測試滑桿：這部分的內容會觸發滑桿。</div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('infoToggleBtn');
        const infoDetails = document.getElementById('fileInfoDetails');

        toggleBtn.addEventListener('click', function() {
            const isActive = infoDetails.classList.toggle('active');
            toggleBtn.textContent = isActive ? '收起資訊' : '查看資訊';
        });
    </script>
</body>
</html>
