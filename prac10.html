<!DOCTYPE html>
<html>
<head>
    <style>
        .custom-button {
            /* 基礎尺寸設定 */
            height: 22px;               /* 對應圖中 h22 */
            border-radius: 8px;        /* 對應圖中 R8 */
            
            /* 顏色與邊框設定 */
            background-color: #ffffff; /* 對應圖中 background #ffffff */
            border: 1px solid #2f2f2f; /* 對應圖中 outline 1px #2f2f2f */
            
            /* 文字設定 */
            color: #2f2f2f;            /* 對應圖中 Color #2f2f2f */
            font-family: sans-serif;   /* Roboto 的通用替代字體 */
            font-size: 13px;           /* 對應圖中 13px */
            
            /* 對齊與間距 */
            padding: 0 15px;           /* 水平內距讓按鈕有寬度 */
            cursor: pointer;           /* 滑鼠移入變手勢 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 增加滑鼠懸停效果 (選用) */
        .custom-button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <button class="custom-button">查看資訊</button>

</body>
</html>
